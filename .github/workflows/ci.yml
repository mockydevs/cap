name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["main"]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Outside contributions arrive as pull requests from forks, so CI must never
# require repository secrets to pass.
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with: { version: 10.14.0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with: { version: 10.14.0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: docker compose -f docker-compose.test.yml up -d --wait
      - run: pnpm --filter @cap/web test:integration
      - name: Print service logs after a failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs --no-color
      - if: always()
        run: docker compose -f docker-compose.test.yml down -v

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with: { version: 10.14.0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cap/e2e exec playwright install --with-deps chromium
      - run: docker compose -f docker-compose.test.yml up -d --wait
      - name: Provision the E2E database and object store
        shell: bash
        run: |
          set -euo pipefail
          compose=(docker compose -f docker-compose.test.yml)
          "${compose[@]}" exec -T localstack-test awslocal s3 mb s3://cap-e2e-test
          key_arn="$("${compose[@]}" exec -T localstack-test awslocal kms create-key --query KeyMetadata.Arn --output text | tr -d '\r')"
          {
            echo 'DATABASE_URL=postgresql://cap:cap@localhost:5433/cap_test'
            echo 'REDIS_URL=redis://localhost:6380'
            echo 'AWS_REGION=us-east-1'
            echo 'AWS_S3_ENDPOINT=http://localhost:4566'
            echo 'AWS_S3_BUCKET_NAME=cap-e2e-test'
            echo "AWS_KMS_KEY_ARN=${key_arn}"
            echo 'AWS_ACCESS_KEY_ID=test'
            echo 'AWS_SECRET_ACCESS_KEY=test'
            echo 'NEXT_PUBLIC_APP_URL=http://localhost:3000'
            echo 'ANALYTICS_HASH_SECRET=e2e-only-analytics-secret-at-least-32-characters'
            # Each simulated signup presents its own x-forwarded-for so the
            # suite does not queue behind one address's rate limit. Playwright
            # talks to the dev server directly, so it is the single hop.
            echo 'TRUSTED_PROXY_HOP_COUNT=1'
          } >> "$GITHUB_ENV"
      - run: pnpm --filter @cap/web db:migrate
      - run: pnpm --filter @cap/e2e test:e2e
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-diagnostics
          path: tests/e2e/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Print service logs after a failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs --no-color
      - if: always()
        run: docker compose -f docker-compose.test.yml down -v

  container-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            dockerfile: apps/web/Dockerfile
          - name: ai-worker
            dockerfile: apps/ai-worker/Dockerfile
          - name: media-worker
            dockerfile: apps/media-worker/Dockerfile
          - name: render-worker
            dockerfile: apps/render-worker/Dockerfile
          - name: transcription-worker
            dockerfile: apps/transcription-worker/Dockerfile
          - name: webhook-worker
            dockerfile: apps/webhook-worker/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: docker build -f "${{ matrix.dockerfile }}" -t "cap-${{ matrix.name }}:ci" .
      - name: Scan production image for fixable vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cap-${{ matrix.name }}:ci
          scanners: vuln
          vuln-type: os,library
          severity: MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

  rust-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Verify the vendored glib UB backport
        run: |
          grep -Fq 'let mut p: *mut libc::c_char' vendor/glib/src/variant_iter.rs
          grep -Fq '&mut p,' vendor/glib/src/variant_iter.rs
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit Rust dependencies
        run: |
          # The exact upstream fix is backported in vendor/glib and verified
          # above; Tauri still constrains the crate version to the affected
          # 0.18 line, so version-only scanners require this narrow exception.
          cargo audit --file apps/desktop/src-tauri/Cargo.lock --ignore RUSTSEC-2024-0429

  desktop-rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt
      - name: Install Linux desktop build dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev libpipewire-0.3-dev libgbm-dev libclang-dev
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
      - run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
      # The recorder's own unit tests — upload chunking, crash recovery — are
      # the only automated coverage the desktop app has.
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked

  # Branch protection requires only this stable check name. Every CI job above
  # must pass first, including every container matrix entry.
  ci-required:
    if: always()
    needs:
      [
        checks,
        integration,
        e2e,
        container-security,
        rust-security,
        desktop-rust,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify all required jobs passed
        env:
          CHECKS: ${{ needs.checks.result }}
          INTEGRATION: ${{ needs.integration.result }}
          E2E: ${{ needs.e2e.result }}
          CONTAINERS: ${{ needs.container-security.result }}
          RUST_SECURITY: ${{ needs.rust-security.result }}
          DESKTOP_RUST: ${{ needs.desktop-rust.result }}
        run: |
          for result in "$CHECKS" "$INTEGRATION" "$E2E" "$CONTAINERS" "$RUST_SECURITY" "$DESKTOP_RUST"; do
            test "$result" = success
          done
