name: cap

x-app-environment: &app-environment
  NODE_ENV: production
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the private PostgreSQL connection string}
  REDIS_URL: ${REDIS_URL:?Set REDIS_URL to the private Redis connection string}
  AWS_REGION: ${AWS_REGION:?Set AWS_REGION}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY}
  AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:?Set AWS_S3_BUCKET_NAME}
  AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT:-}
  AWS_KMS_KEY_ARN: ${AWS_KMS_KEY_ARN:-}

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    expose:
      - "3000"
    labels:
      - "traefik.docker.network=coolify"
    restart: unless-stopped
    environment:
      <<: *app-environment
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Set the public HTTPS application URL}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:?Set the Google web OAuth client ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:?Set the Google web OAuth client secret}
      GOOGLE_DESKTOP_OAUTH_CLIENT_ID: ${GOOGLE_DESKTOP_OAUTH_CLIENT_ID:-}
      ANALYTICS_HASH_SECRET: ${ANALYTICS_HASH_SECRET:?Set a random secret of at least 32 characters}
      WEBHOOK_SECRETS_KMS_KEY_ARN: ${WEBHOOK_SECRETS_KMS_KEY_ARN:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-text-embedding-3-small}
      AI_EMBEDDING_BACKFILL_LIMIT: ${AI_EMBEDDING_BACKFILL_LIMIT:-128}
      AI_ALLOW_DEPLOYMENT_CREDENTIAL: ${AI_ALLOW_DEPLOYMENT_CREDENTIAL:-false}
      # Seals and unseals workspace provider keys; the web app also reads them
      # back to embed on a workspace's own credential.
      AI_CREDENTIALS_KMS_KEY_ARN: ${AI_CREDENTIALS_KMS_KEY_ARN:-}
      AI_CREDENTIALS_LOCAL_KEY: ${AI_CREDENTIALS_LOCAL_KEY:-}
      # Optional: leave unset to run bring-your-own-key only. See docs/BILLING.md.
      AI_PLANS: ${AI_PLANS:-}
      AI_MANAGED_MARKUP_PERCENT: ${AI_MANAGED_MARKUP_PERCENT:-0}
      AI_TRIAL_CREDIT_MICROUNITS: ${AI_TRIAL_CREDIT_MICROUNITS:-0}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    networks: [cap-internal]

  media-worker:
    build:
      context: .
      dockerfile: apps/media-worker/Dockerfile
    restart: unless-stopped
    environment:
      <<: *app-environment
      MEDIA_WORKER_CONCURRENCY: ${MEDIA_WORKER_CONCURRENCY:-1}
      MEDIA_WORKER_HEALTH_PORT: 8081
    networks: [cap-internal]

  transcription-worker:
    build:
      context: .
      dockerfile: apps/transcription-worker/Dockerfile
    restart: unless-stopped
    environment:
      <<: *app-environment
      TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER:-openai-compatible}
      TRANSCRIPTION_BASE_URL: ${TRANSCRIPTION_BASE_URL:-https://api.openai.com/v1}
      TRANSCRIPTION_API_KEY: ${TRANSCRIPTION_API_KEY:-}
      TRANSCRIPTION_MODEL: ${TRANSCRIPTION_MODEL:-gpt-4o-mini-transcribe}
      TRANSCRIPTION_WORKER_CONCURRENCY: ${TRANSCRIPTION_WORKER_CONCURRENCY:-2}
      TRANSCRIPTION_WORKER_HEALTH_PORT: 8082
      TRANSCRIPTION_CONSENT_BASIS: ${TRANSCRIPTION_CONSENT_BASIS:?Set the approved transcription consent basis}
      TRANSCRIPTION_CONSENT_ACTOR_USER_ID: ${TRANSCRIPTION_CONSENT_ACTOR_USER_ID:-}
      # Needed to unseal a workspace's own transcription credential, and to
      # decide whether an unentitled workspace may fall back to this deployment.
      AI_ALLOW_DEPLOYMENT_CREDENTIAL: ${AI_ALLOW_DEPLOYMENT_CREDENTIAL:-false}
      AI_CREDENTIALS_KMS_KEY_ARN: ${AI_CREDENTIALS_KMS_KEY_ARN:-}
      AI_CREDENTIALS_LOCAL_KEY: ${AI_CREDENTIALS_LOCAL_KEY:-}
      AI_MANAGED_MARKUP_PERCENT: ${AI_MANAGED_MARKUP_PERCENT:-0}
      AI_TRIAL_CREDIT_MICROUNITS: ${AI_TRIAL_CREDIT_MICROUNITS:-0}
    networks: [cap-internal]

  render-worker:
    build:
      context: .
      dockerfile: apps/render-worker/Dockerfile
    restart: unless-stopped
    environment:
      <<: *app-environment
      RENDER_WORKER_CONCURRENCY: ${RENDER_WORKER_CONCURRENCY:-1}
      RENDER_WORKER_HEALTH_PORT: 8083
      RENDER_TIMEOUT_MS: ${RENDER_TIMEOUT_MS:-1800000}
    networks: [cap-internal]

  ai-worker:
    build:
      context: .
      dockerfile: apps/ai-worker/Dockerfile
    restart: unless-stopped
    environment:
      <<: *app-environment
      AI_PROVIDER: ${AI_PROVIDER:-OPENAI}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-5-mini}
      AI_ALLOW_DEPLOYMENT_CREDENTIAL: ${AI_ALLOW_DEPLOYMENT_CREDENTIAL:-false}
      AI_CREDENTIALS_KMS_KEY_ARN: ${AI_CREDENTIALS_KMS_KEY_ARN:-}
      AI_MANAGED_MARKUP_PERCENT: ${AI_MANAGED_MARKUP_PERCENT:-0}
      AI_TRIAL_CREDIT_MICROUNITS: ${AI_TRIAL_CREDIT_MICROUNITS:-0}
      AI_INPUT_COST_MICROUNITS_PER_MILLION: ${AI_INPUT_COST_MICROUNITS_PER_MILLION:-250000}
      AI_OUTPUT_COST_MICROUNITS_PER_MILLION: ${AI_OUTPUT_COST_MICROUNITS_PER_MILLION:-2000000}
      AI_WORKER_CONCURRENCY: ${AI_WORKER_CONCURRENCY:-2}
      AI_WORKER_HEALTH_PORT: 8084
    networks: [cap-internal]

  webhook-worker:
    build:
      context: .
      dockerfile: apps/webhook-worker/Dockerfile
    restart: unless-stopped
    environment:
      <<: *app-environment
      WEBHOOK_WORKER_CONCURRENCY: ${WEBHOOK_WORKER_CONCURRENCY:-4}
      WEBHOOK_WORKER_HEALTH_PORT: 8085
    networks: [cap-internal]

networks:
  cap-internal:
    driver: bridge
