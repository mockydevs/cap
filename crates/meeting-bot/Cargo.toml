[package]
name = "cap-meeting-bot"
version = "0.1.0"
description = "Isolated calendar attendance runner: joins a Google Meet as a named notetaker, records through the Cap meeting pipeline"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
# Lets tests point the runner at a local stand-in for Google Meet. Never
# enabled in release images: production only ever opens meet.google.com.
fake-meet = []

[dependencies]
cap-meeting-detector = { path = "../meeting-detector" }
cap-meeting-protocol = { path = "../meeting-protocol" }
cap-meeting-recorder = { path = "../meeting-recorder" }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(target_os = "linux")'.dependencies]
# prctl(PR_SET_DUMPABLE, 0): Chrome runs as the same user, so keep it from
# reading this process's memory and /proc/<pid>/environ (the runner token).
nix = { version = "0.30", default-features = false, features = ["process"] }

[dev-dependencies]
axum = "0.8"
cap-server = { path = "../cap-server" }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "uuid"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }

[lints]
workspace = true
