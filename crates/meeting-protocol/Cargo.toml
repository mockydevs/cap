[package]
name = "cap-meeting-protocol"
version = "0.1.0"
description = "Shared meeting lifecycle, Calari integration contract and request signing"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std"] }
hex = "0.4"
hmac = "0.12"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
subtle = "2.6"
thiserror = "2"

[lints]
workspace = true
