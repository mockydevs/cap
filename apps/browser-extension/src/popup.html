<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
    <title>Cap</title>
  </head>
  <body>
    <header><strong>cap</strong><span>screen recorder</span></header>
    <main>
      <button id="record" class="primary">Start a recording</button>
      <button id="library">Open recording library</button>
      <details>
        <summary>Server settings</summary>
        <label for="server">Cap server URL</label
        ><input id="server" type="url" spellcheck="false" /><button id="save">
          Save and verify
        </button>
        <p id="status" role="status"></p>
      </details>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
