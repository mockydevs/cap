<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
    <title>Cap</title>
  </head>
  <body>
    <header><strong>cap</strong><span>screen recorder</span></header>
    <main>
      <div id="pending-upload-banner" class="banner" hidden>
        <p>A recording didn't finish uploading last time.</p>
        <button id="resume-upload">Finish uploading</button>
      </div>

      <section id="login-section" hidden>
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" />
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          autocomplete="current-password"
        />
        <button id="sign-in" class="primary">Sign in</button>
        <button id="sign-in-google">Sign in with Google</button>
        <p id="login-status" role="status"></p>
      </section>

      <section id="recording-section" hidden>
        <p id="signed-in-as" class="signed-in-as"></p>
        <label for="source">Source</label>
        <select id="source">
          <option value="tab">Current Tab</option>
          <option value="screen">Full Screen</option>
          <option value="window">Window</option>
          <option value="camera-only">Camera only</option>
        </select>
        <label class="checkbox"
          ><input id="include-mic" type="checkbox" checked /> Include
          microphone</label
        >
        <label class="checkbox"
          ><input id="include-camera" type="checkbox" /> Include camera</label
        >
        <label for="title">Title</label>
        <input id="title" type="text" spellcheck="false" />
        <button id="start-recording" class="primary">Start Recording</button>
        <button id="sign-out">Sign out</button>
      </section>

      <button id="library">Open recording library</button>
      <details>
        <summary>Server settings</summary>
        <label for="server">Cap server URL</label
        ><input id="server" type="url" spellcheck="false" /><button id="save">
          Save and verify
        </button>
        <p id="status" role="status"></p>
      </details>
    </main>
    <script src="popup.js" type="module"></script>
  </body>
</html>
