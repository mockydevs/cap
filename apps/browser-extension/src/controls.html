<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
    <title>Cap recording controls</title>
  </head>
  <body>
    <main class="controls">
      <video id="camera-preview" autoplay muted playsinline hidden></video>
      <p id="controls-status" role="status">Recording…</p>
      <div class="controls-buttons">
        <button id="pause">Pause</button>
        <button id="resume" hidden>Resume</button>
        <button id="stop" class="primary">Stop</button>
      </div>
    </main>
    <script src="controls.js" type="module"></script>
  </body>
</html>
