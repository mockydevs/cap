[package]
name = "cap-desktop"
version = "0.2.0-beta.5"
description = "Crash-safe cross-platform Cap recorder"
edition = "2021"

[lib]
name = "cap_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["fs", "io-util", "net", "process", "sync"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
xcap = "0.6"

# mkfifo(2) has no std wrapper; used only to create the named pipe that feeds
# the macOS ScreenCaptureKit system-audio helper's PCM output into ffmpeg.
# `libc` is already pulled in transitively on every platform (e.g. via
# tauri/gtk on Linux), so this adds no new crate to the dependency tree —
# it just exposes the one already-compiled crate directly, scoped to macOS.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
